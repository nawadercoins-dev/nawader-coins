<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة أسماء وأيقونات الأقسام</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f7f7f5;color:#292929;margin:0;padding:22px}main{max-width:950px;margin:auto}h1{font-size:25px}.hint{color:#666;line-height:1.8}.item{display:grid;grid-template-columns:1.2fr 100px 95px;gap:12px;align-items:end;background:white;border:1px solid #d7d2ce;border-right:4px solid #786454;border-radius:12px;padding:14px;margin:10px 0}.item b{grid-column:1/-1}.item label{display:block;font-size:13px;color:#666}.item input{width:100%;padding:10px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:16px}button,.back{display:inline-block;border:0;border-radius:9px;background:#635144;color:white;padding:13px 20px;font-weight:bold;cursor:pointer;text-decoration:none}.back{background:#eee;color:#333}#status{margin:14px 0;font-weight:bold}#preview{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}#preview span{border:1px solid #d2c9c2;border-radius:9px;padding:10px;background:#fff}@media(max-width:540px){.item{grid-template-columns:1fr 80px}.item label:first-of-type{grid-column:1/-1}}</style></head><body><main><a class="back" href="/admin">العودة للإدارة</a><h1>إدارة أسماء وأيقونات أقسام نوادر المقتنيات</h1><p class="hint">يمكن تغيير المسمى والأيقونة والترتيب. روابط الأقسام ومعرّفات المنتجات ثابتة. التعديلات لا تظهر للزوار إلا بعد الضغط على حفظ.</p><div id="rows"></div><h2>معاينة قبل الحفظ</h2><div id="preview"></div><button id="save">حفظ التغييرات</button><p id="status" role="status"></p></main><script>
const rows=document.getElementById('rows'),preview=document.getElementById('preview'),status=document.getElementById('status');const keys=['fantasia','antiques','prayer-beads','vehicles-models','aviation-marine','jewelry-stones','games','other'];function fields(){const result={};rows.querySelectorAll('.item').forEach(row=>{result[row.dataset.key]={label:row.querySelector('[name=label]').value.trim(),icon:row.querySelector('[name=icon]').value.trim(),order:Number(row.querySelector('[name=order]').value)}});return result}function draw(){preview.replaceChildren();Object.values(fields()).sort((a,b)=>a.order-b.order).forEach(v=>{const span=document.createElement('span');span.textContent=v.icon+' '+v.label;preview.appendChild(span)})}async function init(){try{const r=await fetch('/api/settings/admin',{credentials:'same-origin'});if(!r.ok)throw Error('تعذر قراءة إعدادات الإدارة');const st=(await r.json()).settings||{};const defaults=(await (await fetch('/api/collectible-categories')).json()).categories||{};const current=st.collectibleCategoryDisplay||defaults;keys.forEach((key,i)=>{const v=current[key]||defaults[key]||{label:key,icon:'📦',order:i};const div=document.createElement('div');div.className='item';div.dataset.key=key;const b=document.createElement('b');b.textContent='التصنيف الداخلي: '+key;div.appendChild(b);[['label','المسمى',v.label,'text'],['icon','الأيقونة',v.icon,'text'],['order','الترتيب',v.order,'number']].forEach(([name,title,value,type])=>{const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.name=name;input.type=type;input.value=value;input.required=true;if(name==='order'){input.min=0;input.max=99}else input.maxLength=name==='label'?45:8;input.addEventListener('input',draw);label.appendChild(input);div.appendChild(label)});rows.appendChild(div)});draw()}catch(e){status.textContent='تعذر التحميل: '+e.message}}document.getElementById('save').onclick=async()=>{const data=fields();for(const v of Object.values(data)){if(!v.label||!v.icon||v.order<0||v.order>99){status.textContent='راجع الحقول قبل الحفظ';return}}try{status.textContent='جارٍ الحفظ…';const r=await fetch('/api/settings',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({collectibleCategoryDisplay:data})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'فشل الحفظ');status.textContent='تم حفظ المسميات والأيقونات والترتيب. راجع صفحة نوادر المقتنيات.'}catch(e){status.textContent='لم يتم الحفظ: '+e.message}};init();
</script></body></html>
