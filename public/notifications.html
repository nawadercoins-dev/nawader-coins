<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b35"><title>الإشعارات | نوادر العملات</title><link rel="stylesheet" href="/visitor.css?v=5.6.2-r8"><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial;background:#f4f6f8;color:#13243a}.hero{background:#071b35;color:#fff;border-bottom:4px solid #c89b3c;padding:20px}.top{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:#e7c878}.wrap{max-width:960px;margin:auto;padding:24px 14px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid #cbd4df;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer}.tabs button.active{background:#071b35;color:#fff}.notice{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid #dbe1e8;border-radius:16px;padding:15px;margin:10px 0}.notice.unread{border-right:5px solid #c89b3c}.ico{font-size:24px}.notice h3{margin:0 0 5px;font-size:17px}.notice p{margin:0 0 7px;line-height:1.7}.notice small{color:#6d7887}.notice a{background:#071b35;color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px}.empty{background:#fff;border:1px dashed #c8d0da;border-radius:16px;padding:24px;text-align:center}@media(max-width:620px){.notice{grid-template-columns:42px 1fr}.notice a{grid-column:1/-1;text-align:center}}</style></head><body><header class="hero"><div class="top"><div><h1>🔔 الإشعارات</h1><div data-account-name>زائر</div></div><nav class="visitor-nav"><a class="primary" href="/home">⌂ الرئيسية</a><a href="/account">👤 حسابي</a><a href="/auction">⚖ المزادات</a><a href="/market">🛍 السوق</a><button data-logout hidden>خروج</button></nav></div></header><main class="wrap"><div class="tabs"><button class="active" data-f="all">الكل</button><button data-f="auction">المزادات</button><button data-f="approval">الاعتمادات</button><button data-f="market">السوق</button><button data-f="finance">المالية</button></div><div id="list" class="empty">سجّل الدخول من حسابي لعرض إشعاراتك.</div></main><script src="/visitor.js?v=5.6.2-r8"></script><script>
const $=x=>document.getElementById(x);let filter='all',rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ico(c){return c==='auction'?'⚖':c==='approval'?'✓':c==='market'?'🛍':c==='finance'?'💳':'🔔'}function draw(){let a=filter==='all'?rows:rows.filter(x=>x.category===filter);$('list').className=a.length?'':'empty';$('list').innerHTML=a.map(x=>`<article class="notice ${x.read?'':'unread'}"><span class="ico">${ico(x.category)}</span><div><h3>${esc(x.title)}</h3><p>${esc(x.message)}</p><small>${new Date(x.created).toLocaleString('ar-SA')}</small></div>${x.actionUrl?`<a href="${esc(x.actionUrl)}">فتح</a>`:''}</article>`).join('')||'لا توجد إشعارات في هذا القسم.'}async function load(){let v=NawaderVisitor.get();if(!v?.verified){$('list').textContent='سجّل الدخول من حسابي لعرض إشعاراتك.';return}let r=await fetch('/api/notifications?participantId='+encodeURIComponent(v.id),{cache:'no-store'}),d=await r.json();if(!r.ok){$('list').textContent=d.error||'تعذر تحميل الإشعارات';return}rows=d.notifications||[];draw();await fetch('/api/notifications/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participantId:v.id})});}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;draw()});load();
</script></body></html>
