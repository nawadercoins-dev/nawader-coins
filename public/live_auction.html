*{box-sizing:border-box}body{margin:0;background:#071426;color:#10213e}.live-shell{max-width:1380px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#fff}.top a{color:#fff;text-decoration:none;font-weight:900}.panel{background:#fff;border-radius:18px;padding:14px;margin:12px 0}.live-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.live-session-card{border:1px solid #dce3ec;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}.watch-btn{border:0;border-radius:10px;background:#b51f32;color:#fff;padding:10px;font-weight:900}.viewer{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.72fr);gap:14px;align-items:start}.video-wrap{min-width:0}.video-stage{aspect-ratio:16/9;background:#02070d;border-radius:16px;overflow:hidden;display:grid;place-items:center;position:relative}.video-stage video{width:100%;height:100%;object-fit:contain}.live-badge{position:absolute;top:10px;right:10px;background:#b51f32;color:#fff;padding:6px 10px;border-radius:999px;font-weight:900;z-index:3}.status-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:#0b3260;color:#fff;border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:1.05rem}.side{display:grid;gap:12px}.lot-card,.chat-card{border:1px solid #dce3ec;border-radius:16px;background:#fff;overflow:hidden}.lot-head,.chat-head{padding:11px 12px;background:#0b3260;color:#fff;font-weight:900}.lot-body{padding:12px}.lot-image{width:100%;height:170px;object-fit:contain;background:#f4f6f9;border-radius:12px;margin-bottom:10px}.live-price{font-size:2rem;font-weight:1000;color:#0b3260}.countdown{font-weight:900;color:#a52638}.bid-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.bid-row input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.bid-row button{border:0;background:#c78b2d;color:#ff
