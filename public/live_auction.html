<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/visitor.css?v=5.4.3"><title>البث المباشر — نوادر العملات</title><style>
.live-shell{width:min(1180px,94vw);margin:auto}.live-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.live-session-card{border:1px solid #dce3ec;border-radius:16px;padding:14px;background:#fff}.watch-btn{border:0;border-radius:10px;background:#b51f32;color:white;padding:10px 14px;font-weight:900;cursor:pointer}.viewer-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.video-stage{background:#000;border-radius:16px;min-height:390px;display:grid;place-items:center;overflow:hidden}.video-stage video{width:100%;height:100%;max-height:72vh;object-fit:contain}.lot-box{border:1px solid #ddc078;background:#fffaf0;border-radius:15px;padding:14px}.live-price{font-size:1.8rem;font-weight:1000;color:#0b3260}.live-count{font-size:1.1rem;font-weight:900;color:#a52638}.live-actions{display:flex;gap:8px;flex-wrap:wrap}.live-actions input{min-width:140px;flex:1;padding:10px;border:1px solid #cad5e2;border-radius:10px}.live-actions button{border:0;border-radius:10px;padding:10px 14px;background:#0b3260;color:#fff;font-weight:900}.back-live{border:0;background:#eef2f6;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer}.auction-ticker{overflow:hidden;border-radius:12px;background:#0b3260;color:#fff;margin:10px 0;white-space:nowrap}.auction-ticker-track{display:inline-flex;gap:38px;min-width:100%;padding:9px 0;font-weight:900;animation:tickerMove 18s linear infinite}.auction-ticker-track span{padding-inline:14px}@keyframes tickerMove{from{transform:translateX(20%)}to{transform:translateX(-100%)}}.live-market{margin-top:12px;border:1px solid #d8b45b;background:#fffaf0;border-radius:15px;padding:12px}.live-market-row{display:flex;gap:10px;overflow-x:auto}.live-market-item{min-width:180px;max-width:210px;background:#fff;border:1px solid #e0e5eb;border-radius:12px;padding:8px}.live-market-item img{width:100%;height:110px;object-fit:contain;background:#f5f6f8;border-radius:8px}.live-market-item b{display:block;margin:6px 0}.live-market-item a{display:inline-block;text-decoration:none;background:#c78b2d;color:#fff;border-radius:8px;padding:7px 9px;font-weight:900}@media(max-width:820px){.viewer-grid{grid-template-columns:1fr}.video-stage{min-height:260px}}

/* V5.4.3 — Responsive viewer layout */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:none;margin:0;padding:0;overflow-x:hidden}
body{min-height:100vh}
.site-header{width:100%;max-width:1320px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.site-header h1{margin:0;font-size:clamp(1.35rem,2.6vw,2rem)}
.live-shell{width:100%;max-width:1320px;margin:0 auto;padding:0 18px 30px}
.live-shell>.panel{width:100%;min-width:0}
.live-list{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.live-session-card{min-width:0;padding:12px;display:flex;flex-direction:column;gap:6px}
.live-session-card h3,.live-session-card p{margin:.15rem 0;overflow-wrap:anywhere}
.live-session-card .watch-btn{margin-top:auto;width:100%}
.viewer-grid{grid-template-columns:minmax(0,1.55fr) minmax(300px,.55fr);align-items:start;gap:16px}
.viewer-grid>div{min-width:0}
.video-stage{width:100%;min-height:0;aspect-ratio:16/9;border-radius:16px}
.video-stage video{display:block;width:100%;height:100%;max-height:none;object-fit:contain}
.lot-box{position:sticky;top:12px;min-width:0}
.live-actions{align-items:center}
.live-actions button{min-height:42px}
.auction-ticker{width:100%}
.live-market-row{scroll-snap-type:x proximity;padding-bottom:5px}
.live-market-item{scroll-snap-align:start;flex:0 0 190px}
@media(max-width:1100px){
  .live-list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .viewer-grid{grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr)}
}
@media(max-width:820px){
  .site-header{padding:10px}
  .live-shell{padding:0 10px 24px}
  .live-list{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .live-session-card{flex:0 0 min(78vw,260px);scroll-snap-align:start}
  .viewer-grid{grid-template-columns:1fr;gap:10px}
  .video-stage{aspect-ratio:16/9;min-height:0;border-radius:12px}
  .lot-box{position:static;order:2}
  .live-actions{display:grid;grid-template-columns:1fr auto;gap:7px}
  .live-actions h2{margin:.4rem 0;min-width:0}
  .auction-ticker-track{font-size:.9rem}
}
@media(max-width:520px){
  .site-header{align-items:flex-start}
  .site-header a{font-size:.95rem}
  .live-shell{padding:0 8px 20px}
  .live-shell>.panel{padding:10px!important;border-radius:14px!important}
  #viewerPanel>.live-actions{grid-template-columns:1fr auto}
  .video-stage{border-radius:10px}
  .lot-box{padding:10px;border-radius:12px}
  .live-price{font-size:1.45rem}
  .live-actions input{min-width:0;width:100%;font-size:16px}
  .live-actions button{padding:9px 10px}
  .live-market-item{flex-basis:160px;max-width:170px}
  .live-market-item img{height:96px}
}

</style></head><body><header class="site-header"><a href="/home">نوادر العملات</a><h1>🔴 البث المباشر</h1></header><main class="page-shell live-shell"><section class="panel"><p class="muted">شاهد المزاد من الكاميرا مباشرة. الفيديو والصوت لحظيان ولا يتم تسجيلهما.</p><div id="liveList" class="live-list"></div></section><section id="viewerPanel" class="panel" hidden><div class="live-actions" style="justify-content:space-between"><h2 id="viewerTitle">البث</h2><button class="back-live" id="closeViewer">إغلاق المشاهدة</button></div><div class="auction-ticker" id="viewerTicker" hidden><div class="auction-ticker-track" id="viewerTickerTrack"></div></div><div class="viewer-grid"><div><div id="videoStage" class="video-stage"><span style="color:white">جارٍ الاتصال بالبث…</span></div><p id="videoMsg" class="muted"></p><section id="liveMarket" class="live-market" hidden><h3>🛍️ السوق أثناء البث</h3><div id="liveMarketRow" class="live-market-row"></div></section></div><div id="bidPanel" class="lot-box"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script><script src="/live_auction.js?v=5.4.3"></script></body></html>
