<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة البائع | نوادر العملات</title><link rel="stylesheet" href="/visitor.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f6f8;color:#14243b}.hero{background:#071b35;color:white;padding:20px;border-bottom:4px solid #c89b3c}.top,.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.top h1{color:#e7c878;margin:0}.wrap{padding:22px 14px}.panel{background:#fff;border:1px solid #d9e0e8;border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{border:1px solid #dde3ea;border-radius:14px;padding:14px}.status{font-weight:800;color:#8a642b}</style></head><body><header class="hero"><div class="top"><div><h1>بوابة البائع</h1><div data-account-name>زائر</div></div><nav class="visitor-nav"><a class="primary" href="/home">⌂ الرئيسية</a><a href="/account">👤 حسابي</a><a href="/notifications">🔔 الإشعارات</a></nav></div></header><main class="wrap"><section class="panel"><h2>صلاحياتي</h2><div id="perms">سجّل الدخول من حسابي أولًا.</div></section><section class="panel"><h2>مزاداتي المنتهية</h2><div id="ended" class="grid"></div></section><section class="panel"><h2>متابعة السوق والطلبات</h2><div id="market" class="grid"></div></section></main><script src="/visitor.js"></script><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function get(u){let r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر التحميل');return d}async function load(){let v=NawaderVisitor.get();if(!v?.verified)return;try{let p=(await get('/api/permissions/me?participantId='+encodeURIComponent(v.id))).permissions||{};$('perms').innerHTML=`${p.sellerEndedAuctions?'✅':'⛔'} المزادات المنتهية الخاصة بي &nbsp; ${p.sellerMarket?'✅':'⛔'} متابعة السوق &nbsp; ${p.marketSupervision?'✅':'⛔'} إشراف السوق`;if(p.sellerEndedAuctions){let d=await get('/api/seller/ended?participantId='+encodeURIComponent(v.id));$('ended').innerHTML=(d.items||[]).map(x=>`<div class="card"><b>${esc(x.country)} — ${esc(x.denomination)}</b><p>آخر سعر: ${Number(x.auctionCurrentPrice||0).toLocaleString('ar-SA')} ر.س</p><p class="status">منتهي</p></div>`).join('')||'لا توجد مزادات منتهية خاصة بك.'}else $('ended').textContent='لا توجد صلاحية لهذه الصفحة.';if(p.sellerMarket||p.marketSupervision){let d=await get('/api/seller/market?participantId='+encodeURIComponent(v.id));$('market').innerHTML=(d.requests||[]).map(x=>`<div class="card"><b>${esc(x.itemTitle)}</b><p>${esc(x.action==='offer'?'عرض تفاوض':'طلب شراء')}</p><p>الكمية: ${Number(x.quantity||1)}</p><p class="status">${esc(({completed:'مكتمل',rejected:'مرفوض',pending:'قيد الانتظار',approved:'مقبول',cancelled:'ملغي'}[x.status])||x.status||'قيد الانتظار')}</p></div>`).join('')||'لا توجد طلبات حالية.'}else $('market').textContent='لا توجد صلاحية لمتابعة السوق.'}catch(e){$('perms').textContent=e.message}}load();
</script></body></html>
