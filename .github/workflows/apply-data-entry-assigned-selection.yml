name: Apply data-entry assigned selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-data-entry-assigned-selection.yml'
      - 'tools/patch_data_entry_assigned_selection.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply assigned selection patch
        run: python tools/patch_data_entry_assigned_selection.py
      - name: Validate UI
        run: |
          git diff --check
          grep -q "data-entry-assigned-selection-v1" public/data_entry.html
          grep -q "selectAllAssignedRows" public/data_entry.html
          grep -q "toggleAssignedRow" public/data_entry.html
          grep -q "assignedSelectionCount" public/data_entry.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data_entry.html
          if git diff --cached --quiet; then
            echo "No application changes needed"
          else
            git commit -m "fix: enable manual and select-all assigned records"
            git push origin HEAD:main
          fi
