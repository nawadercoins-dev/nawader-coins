name: Apply account order flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-account-order-flow.yml'
      - 'tools/patch_account_order_flow.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch account order flow
        run: python tools/patch_account_order_flow.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'account-order-flow-v1' public/account.html
          grep -q 'orderNextStep' public/account.html
          grep -q 'الطلب جاهز للسداد الآن' public/account.html
          grep -q 'أكمل عنوان الشحن' public/account.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/account.html
          if git diff --cached --quiet; then
            echo "No application changes needed"
          else
            git commit -m "feat: unify customer order payment and shipping flow"
            git push origin HEAD:main
          fi
