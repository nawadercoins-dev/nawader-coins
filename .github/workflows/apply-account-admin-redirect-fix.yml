name: Apply account admin redirect fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-account-admin-redirect-fix.yml'
      - 'tools/patch_account_admin_redirect_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch account role redirect
        run: python tools/patch_account_admin_redirect_fix.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'account-admin-redirect-fix-v1' public/account.html
          ! grep -q "location.replace(d.redirect)" public/account.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/account.html
          if git diff --cached --quiet; then
            echo "No application changes needed"
          else
            git commit -m "fix: keep buyer account and order flow on account page"
            git push origin HEAD:main
          fi
