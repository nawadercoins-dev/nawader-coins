name: Build V5.6.7 performance upgrade
on:
  push:
    branches:
      - release/v5.6.7
    paths:
      - .github/workflows/build-v5.6.7-performance.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v5.6.7
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe performance improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          server = Path('server.py')
          s = server.read_text(encoding='utf-8')
          old_cache_headers = (
              "        self.send_header('Cache-Control','no-store, no-cache, must-revalidate, max-age=0')\n"
              "        self.send_header('Pragma','no-cache')\n"
              "        self.send_header('Expires','0')\n"
          )
          new_cache_headers = (
              "        # V5.6.7 PERFORMANCE: response methods own their cache policy.\n"
              "        # Static JS/CSS/images may be cached; API/HTML responses keep explicit no-store.\n"
          )
          if s.count(old_cache_headers) != 1:
              raise SystemExit(f'end_headers cache anchor count={s.count(old_cache_headers)}')
          s = s.replace(old_cache_headers, new_cache_headers, 1)

          pat = re.compile(
              r"(    def send_file\(self,path,content_type=None\):.*?"
              r"            self\.send_header\('Content-Length',str\(size\)\)\n)"
              r"            self\.send_header\('Cache-Control','no-store'\)",
              re.S,
          )
          repl = (
              r"\1"
              "            ext=os.path.splitext(path)[1].lower()\n"
              "            if ext in ('.jpg','.jpeg','.png','.webp','.gif','.svg','.ico'):\n"
              "                self.send_header('Cache-Control','public, max-age=86400')\n"
              "            elif ext in ('.js','.css','.woff','.woff2','.ttf'):\n"
              "                self.send_header('Cache-Control','public, max-age=3600')\n"
              "            else:\n"
              "                self.send_header('Cache-Control','no-store')"
          )
          s, count = pat.subn(repl, s, count=1)
          if count != 1:
              raise SystemExit(f'send_file cache anchor count={count}')
          server.write_text(s, encoding='utf-8')

          app = Path('admin/app.js')
          a = app.read_text(encoding='utf-8')
          old_all = (
              'async function all() {\n'
              '  return ((await api("/api/items")).items || []).filter(i => ![\'archived\',\'removed\'].includes(i.moderationStatus||\'\') && !i.ownerArchived);\n'
              '}\n'
              "async function archivedItems(){ return (await api('/api/archive/items')).items || []; }\n"
              'async function put(x) {\n'
              '  return api("/api/item", {\n'
              '    method: "POST",\n'
              '    body: JSON.stringify({ item: x }),\n'
              '  });\n'
              '}\n'
              'async function del(id) {\n'
              '  return api("/api/item/" + encodeURIComponent(id), { method: "DELETE" });\n'
              '}\n'
          )
          new_all = (
              '// V5.6.7 PERFORMANCE — coalesce repeated inventory reads while navigating admin views.\n'
              'let __itemsCacheRows = null, __itemsCacheAt = 0, __itemsInflight = null;\n'
              'function invalidateItemsCache(){ __itemsCacheRows=null; __itemsCacheAt=0; __itemsInflight=null; }\n'
              'async function all(force=false) {\n'
              '  const now=Date.now();\n'
              '  if (!force && __itemsCacheRows && (now-__itemsCacheAt)<4000) return __itemsCacheRows;\n'
              '  if (!force && __itemsInflight) return __itemsInflight;\n'
              '  const job=(async()=>((await api("/api/items")).items || []).filter(i => ![\'archived\',\'removed\'].includes(i.moderationStatus||\'\') && !i.ownerArchived))();\n'
              '  __itemsInflight=job;\n'
              '  try {\n'
              '    const rows=await job;\n'
              '    __itemsCacheRows=rows;\n'
              '    __itemsCacheAt=Date.now();\n'
              '    return rows;\n'
              '  } finally {\n'
              '    if (__itemsInflight===job) __itemsInflight=null;\n'
              '  }\n'
              '}\n'
              "async function archivedItems(){ return (await api('/api/archive/items')).items || []; }\n"
              'async function put(x) {\n'
              '  const result=await api("/api/item", {\n'
              '    method: "POST",\n'
              '    body: JSON.stringify({ item: x }),\n'
              '  });\n'
              '  invalidateItemsCache();\n'
              '  return result;\n'
              '}\n'
              'async function del(id) {\n'
              '  const result=await api("/api/item/" + encodeURIComponent(id), { method: "DELETE" });\n'
              '  invalidateItemsCache();\n'
              '  return result;\n'
              '}\n'
          )
          if a.count(old_all) != 1:
              raise SystemExit(f'all/put/del anchor count={a.count(old_all)}')
          a = a.replace(old_all, new_all, 1)
          refresh_anchor = '    let allRows = await all();\n'
          if a.count(refresh_anchor) < 1:
              raise SystemExit('refresh all() anchor not found')
          a = a.replace(refresh_anchor, '    let allRows = await all(force);\n', 1)
          app.write_text(a, encoding='utf-8')
          PY
      - name: Python syntax check
        run: python -m py_compile server.py
      - name: JavaScript syntax check
        run: node --check admin/app.js
      - name: Verify performance anchors
        run: |
          grep -q "V5.6.7 PERFORMANCE" server.py
          grep -q "public, max-age=86400" server.py
          grep -q "__itemsCacheRows" admin/app.js
          grep -q "all(force)" admin/app.js
      - name: Commit built release
        run: |
          git config user.name "nawadercoins-dev"
          git config user.email "nawadercoins@gmail.com"
          git add server.py admin/app.js
          if ! git diff --cached --quiet; then
            git commit -m "perf: apply V5.6.7 navigation and static-cache improvements"
            git push origin HEAD:release/v5.6.7
          fi
      - name: Export server.py only
        uses: actions/upload-artifact@v4
        with:
          name: V5.6.7-01-server-only
          path: server.py
          retention-days: 90
      - name: Export app.js only
        uses: actions/upload-artifact@v4
        with:
          name: V5.6.7-02-app-js-only
          path: admin/app.js
          retention-days: 90
