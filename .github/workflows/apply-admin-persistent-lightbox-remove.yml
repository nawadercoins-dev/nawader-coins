name: Apply admin persistent lightbox remove
on:
  push:
    branches: [main]
    paths:
      - tools/patch_admin_persistent_lightbox_remove.py
      - .github/workflows/apply-admin-persistent-lightbox-remove.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_admin_persistent_lightbox_remove.py
      - name: Validate
        run: |
          node --check admin/app.js
          grep -q "admin-persistent-lightbox-remove-v1" admin/app.js
          grep -q "admin-persistent-lightbox-remove-v1" admin/styles.css
          grep -q "coinLightbox:not(\[open\])" admin/styles.css
          grep -q "lightbox3" admin/index.html
          git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/app.js admin/styles.css admin/index.html
          git commit -m "fix: remove persistent collectible viewer from admin pages"
          git push origin HEAD:main
