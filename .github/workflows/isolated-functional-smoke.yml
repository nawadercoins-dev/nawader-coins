name: Isolated functional smoke QA

on:
  push:
    branches:
      - qa/isolated-functional-20260909
    paths:
      - server.py
      - public/**
      - admin/**
      - .github/workflows/isolated-functional-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile server.py
      - name: Start server with isolated data directory
        shell: bash
        run: |
          set -euo pipefail
          export DATA_DIR="$RUNNER_TEMP/nawader-functional-data"
          export PORT=8876
          mkdir -p "$DATA_DIR"
          nohup python server.py >"$RUNNER_TEMP/nawader-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/nawader-server.pid"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8876/home >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/nawader-server.log" || true
          exit 1
      - name: Public route functional smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in /home /market /auction /admin-login; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8876$path")
            test "$code" = "200"
          done
          auth_code=$(curl -sS -o "$RUNNER_TEMP/auth-route.json" -w '%{http_code}' http://127.0.0.1:8876/api/auth/route)
          test "$auth_code" = "200"
      - name: Public market and auction APIs are readable
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/public/market /api/public/auctions /api/public/live-auctions; do
            code=$(curl -sS -o "$RUNNER_TEMP/public.json" -w '%{http_code}' "http://127.0.0.1:8876$path")
            test "$code" = "200"
            python -m json.tool "$RUNNER_TEMP/public.json" >/dev/null
          done
      - name: Protected mutations stay blocked without admin session
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/clear /api/merge /api/shipping-policy; do
            code=$(curl -sS -o "$RUNNER_TEMP/protected.json" -w '%{http_code}' \
              -X POST -H 'Origin: http://127.0.0.1:8876' -H 'Content-Type: application/json' \
              --data '{}' "http://127.0.0.1:8876$path")
            case "$code" in 401|403) ;; *) echo "Expected $path rejection, got HTTP $code"; cat "$RUNNER_TEMP/protected.json" || true; exit 1 ;; esac
          done
      - name: Snapshot seeded market and order data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          root=os.path.join(os.environ['RUNNER_TEMP'],'nawader-functional-data')
          baseline={}
          for name in ('market_requests.json','orders_shipping.json'):
              path=os.path.join(root,name)
              if os.path.exists(path):
                  with open(path,'rb') as f:
                      baseline[name]=hashlib.sha256(f.read()).hexdigest()
              else:
                  baseline[name]=None
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mutation-baseline.json'),'w',encoding='utf-8') as f:
              json.dump(baseline,f,ensure_ascii=False,sort_keys=True)
          PY
      - name: Market purchase and visitor orders require participant session
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/market-request.json" -w '%{http_code}' \
            -X POST -H 'Origin: http://127.0.0.1:8876' -H 'Content-Type: application/json' \
            --data '{"itemId":"qa-nonexistent","participantId":"qa-visitor","action":"buy","quantity":1}' \
            http://127.0.0.1:8876/api/market/request)
          case "$code" in 401|403) ;; *) echo "Unauthenticated market request unexpectedly reached business mutation path: HTTP $code"; cat "$RUNNER_TEMP/market-request.json" || true; exit 1 ;; esac
          code=$(curl -sS -o "$RUNNER_TEMP/orders.json" -w '%{http_code}' \
            'http://127.0.0.1:8876/api/visitor/orders?participantId=qa-visitor')
          case "$code" in 401|403) ;; *) echo "Unauthenticated visitor orders unexpectedly exposed data: HTTP $code"; cat "$RUNNER_TEMP/orders.json" || true; exit 1 ;; esac
      - name: Rejected requests do not mutate seeded market or order data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          root=os.path.join(os.environ['RUNNER_TEMP'],'nawader-functional-data')
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mutation-baseline.json'),encoding='utf-8') as f:
              baseline=json.load(f)
          for name, before in baseline.items():
              path=os.path.join(root,name)
              if os.path.exists(path):
                  with open(path,'rb') as f:
                      after=hashlib.sha256(f.read()).hexdigest()
              else:
                  after=None
              assert after == before, f'rejected request mutated {name}'
          PY
      - name: Verify runtime data is isolated from repository
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/nawader-functional-data/admin_auth.json"
          git checkout -- "رابط_الجوال.txt"
          git diff --exit-code
          if test -n "$(git status --porcelain)"; then
            echo 'Runtime changed repository working tree outside the known local link file; isolation failed.'
            git status --short
            exit 1
          fi
      - name: Stop server and print diagnostics on failure
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/nawader-server.pid"; then kill "$(cat "$RUNNER_TEMP/nawader-server.pid")" 2>/dev/null || true; fi
          echo '--- server log ---'
          cat "$RUNNER_TEMP/nawader-server.log" 2>/dev/null || true
