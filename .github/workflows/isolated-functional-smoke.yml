name: Isolated functional smoke QA

on:
  push:
    branches:
      - qa/isolated-functional-20260909
    paths:
      - server.py
      - public/**
      - admin/**
      - .github/workflows/isolated-functional-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile server.py
      - name: Start server with isolated data directory
        shell: bash
        run: |
          set -euo pipefail
          export DATA_DIR="$RUNNER_TEMP/nawader-functional-data"
          export PORT=8876
          mkdir -p "$DATA_DIR"
          nohup python server.py >"$RUNNER_TEMP/nawader-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/nawader-server.pid"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8876/home >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/nawader-server.log" || true
          exit 1
      - name: Public route functional smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in /home /market /auction /admin-login; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8876$path")
            test "$code" = "200"
          done
          auth_code=$(curl -sS -o "$RUNNER_TEMP/auth-route.json" -w '%{http_code}' http://127.0.0.1:8876/api/auth/route)
          test "$auth_code" = "200"
      - name: Protected mutation stays blocked without admin session
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/clear-response.json" -w '%{http_code}' \
            -X POST \
            -H 'Origin: http://127.0.0.1:8876' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:8876/api/clear)
          case "$code" in
            401|403) ;;
            *) echo "Expected unauthenticated mutation rejection, got HTTP $code"; cat "$RUNNER_TEMP/clear-response.json" || true; exit 1 ;;
          esac
      - name: Verify runtime data is isolated from repository
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/nawader-functional-data/admin_auth.json"
          # server.py intentionally refreshes this local convenience file at startup.
          # It is not application data, so restore it before asserting data isolation.
          git checkout -- "رابط_الجوال.txt"
          git diff --exit-code
          if test -n "$(git status --porcelain)"; then
            echo 'Runtime changed repository working tree outside the known local link file; isolation failed.'
            git status --short
            exit 1
          fi
      - name: Stop server and print diagnostics on failure
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/nawader-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/nawader-server.pid")" 2>/dev/null || true
          fi
          echo '--- server log ---'
          cat "$RUNNER_TEMP/nawader-server.log" 2>/dev/null || true
