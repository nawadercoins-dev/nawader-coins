name: Apply static cache performance fix

on:
  push:
    branches:
      - perf/static-cache-2026-09-07
    paths:
      - scripts/apply_static_cache_policy.py
      - .github/workflows/apply-static-cache-perf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/static-cache-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline syntax check
        run: python -m py_compile server.py
      - name: Apply guarded patch
        run: python scripts/apply_static_cache_policy.py
      - name: Syntax check with diagnostics
        run: |
          if ! python -m py_compile server.py; then
            echo '--- numbered context around failing area ---'
            nl -ba server.py | sed -n '2125,2195p'
            echo '--- patch diff ---'
            git diff -- server.py
            exit 1
          fi
      - name: Verify cache rules in source
        run: |
          grep -q "public, max-age=86400, stale-while-revalidate=604800" server.py
          grep -q "sensitive = raw_path.startswith" server.py
          python - <<'PY'
          from pathlib import Path
          s=Path('server.py').read_text(encoding='utf-8')
          start=s.index('    def send_file(self,path,content_type=None):')
          end=s.find('\n    def ', start+5)
          if end < 0: end=len(s)
          chunk=s[start:end]
          assert "self.send_header('Cache-Control','no-store')" not in chunk
          print('source cache verification passed')
          PY
      - name: Runtime HTTP cache-header QA
        env:
          PORT: '8765'
        run: |
          set -euo pipefail
          python server.py > /tmp/nawader-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/home >/dev/null; then break; fi
            sleep 1
          done
          test_header() {
            path="$1" expected="$2"
            headers=$(mktemp)
            curl -sS -D "$headers" -o /dev/null "http://127.0.0.1:8765$path"
            echo "--- $path ---"
            cat "$headers"
            count=$(grep -ci '^Cache-Control:' "$headers" || true)
            test "$count" -eq 1
            grep -i '^Cache-Control:' "$headers" | grep -F "$expected"
          }
          test_header '/admin/styles.css' 'public, max-age=86400, stale-while-revalidate=604800'
          test_header '/admin/app.js' 'public, max-age=86400, stale-while-revalidate=604800'
          test_header '/home' 'no-store, no-cache, must-revalidate, max-age=0'
          test_header '/admin-login' 'no-store, no-cache, must-revalidate, max-age=0'
          test_header '/api/auth/route' 'no-store'
          test_header '/robots.txt' 'public, max-age=3600'
          test_header '/sitemap.xml' 'public, max-age=300'
          echo 'runtime HTTP cache-header QA passed'
      - name: Commit patched server
        run: |
          if git diff --quiet -- server.py; then
            echo "No server.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "perf(server): cache static assets and uploads safely"
          git push origin HEAD:perf/static-cache-2026-09-07
