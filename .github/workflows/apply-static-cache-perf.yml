name: Apply static cache performance fix

on:
  push:
    branches:
      - perf/static-cache-2026-09-07
    paths:
      - scripts/apply_static_cache_policy.py
      - .github/workflows/apply-static-cache-perf.yml
  workflow_dispatch:

concurrency:
  group: static-cache-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline syntax check
        run: python -m py_compile server.py
      - name: Apply guarded patch
        run: python scripts/apply_static_cache_policy.py
      - name: Syntax check with diagnostics
        run: |
          if ! python -m py_compile server.py; then
            echo '--- numbered context around failing area ---'
            nl -ba server.py | sed -n '2085,2195p'
            echo '--- patch diff ---'
            git diff -- server.py
            exit 1
          fi
      - name: Verify cache rules in source
        run: |
          grep -q "public, max-age=86400, stale-while-revalidate=604800" server.py
          grep -q "private, max-age=86400, stale-while-revalidate=604800" server.py
          grep -q "sensitive = raw_path.startswith" server.py
          grep -q "successful = b' 200 ' in first_line" server.py
          grep -q "is_upload = raw_path.startswith('/uploads/')" server.py
          grep -q "is_admin_asset = raw_path.startswith('/admin/') or raw_path == '/app.js'" server.py
          grep -q "self.send_header('Cache-Control','no-store, no-cache, must-revalidate, max-age=0')" server.py
          python - <<'PY'
          from pathlib import Path
          s=Path('server.py').read_text(encoding='utf-8')
          start=s.index('    def send_file(self,path,content_type=None):')
          end=s.find('\n    def ', start+5)
          if end < 0: end=len(s)
          chunk=s[start:end]
          assert "self.send_header('Cache-Control','no-store')" not in chunk
          req=s[s.index('    def require_admin(self,api=False):'):s.index('    def same_origin_ok(self):')]
          assert "self.send_header('Cache-Control','no-store, no-cache, must-revalidate, max-age=0')" in req
          print('source cache verification passed')
          PY
      - name: Runtime HTTP cache-header QA
        env:
          PORT: '8765'
          ADMIN_PASSWORD: 'qa-cache-test-only'
        run: |
          set -euo pipefail
          mkdir -p uploads
          printf 'qa-private-image' > uploads/qa-cache-private.jpg
          python server.py > /tmp/nawader-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; rm -f uploads/qa-cache-private.jpg; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/home >/dev/null; then break; fi
            sleep 1
          done
          test_response() {
            path="$1" expected_status="$2" expected_cache="$3"
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765$path")
            echo "--- $path [$code] ---"
            cat "$headers"
            test "$code" = "$expected_status"
            count=$(grep -ci '^Cache-Control:' "$headers" || true)
            test "$count" -eq 1
            grep -i '^Cache-Control:' "$headers" | grep -F "$expected_cache"
          }
          test_response '/admin/styles.css' '302' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/admin/app.js' '302' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/app.js' '302' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/uploads/qa-cache-private.jpg' '403' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/assets/qa-cache-missing.css' '404' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/home' '200' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/admin-login' '200' 'no-store, no-cache, must-revalidate, max-age=0'
          test_response '/api/auth/route' '200' 'no-store'
          test_response '/robots.txt' '200' 'public, max-age=3600'
          test_response '/sitemap.xml' '200' 'public, max-age=300'
          test_response '/live_auction.js' '200' 'public, max-age=86400, stale-while-revalidate=604800'

          login_headers=$(mktemp)
          login_code=$(curl -sS -D "$login_headers" -o /dev/null -w '%{http_code}' \
            -c /tmp/admin-cookie \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'username=admin&password=qa-cache-test-only' \
            http://127.0.0.1:8765/admin-login)
          echo "--- admin login [$login_code] ---"
          cat "$login_headers"
          test "$login_code" = '302'
          test "$(grep -ci '^Cache-Control:' "$login_headers" || true)" -eq 1
          grep -i '^Cache-Control:' "$login_headers" | grep -F 'no-store, no-cache, must-revalidate, max-age=0'

          test_authenticated_cache() {
            path="$1" expected_cache="$2"
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' -b /tmp/admin-cookie "http://127.0.0.1:8765$path")
            echo "--- authenticated $path [$code] ---"
            cat "$headers"
            test "$code" = '200'
            count=$(grep -ci '^Cache-Control:' "$headers" || true)
            test "$count" -eq 1
            grep -i '^Cache-Control:' "$headers" | grep -F "$expected_cache"
          }
          test_authenticated_cache '/admin/styles.css' 'private, max-age=86400, stale-while-revalidate=604800'
          test_authenticated_cache '/admin/app.js' 'private, max-age=86400, stale-while-revalidate=604800'
          test_authenticated_cache '/admin/app.js?v=qa' 'private, max-age=86400, stale-while-revalidate=604800'
          test_authenticated_cache '/app.js' 'private, max-age=86400, stale-while-revalidate=604800'
          test_authenticated_cache '/admin' 'no-store, no-cache, must-revalidate, max-age=0'
          test_authenticated_cache '/uploads/qa-cache-private.jpg' 'private, max-age=86400, stale-while-revalidate=604800'
          echo 'runtime HTTP cache-header QA passed'
      - name: Commit patched server
        run: |
          if git diff --quiet -- server.py; then
            echo "No server.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "fix(server): keep protected admin assets out of shared caches"
          git push origin HEAD:perf/static-cache-2026-09-07
