name: Apply static cache performance fix

on:
  push:
    branches:
      - perf/static-cache-2026-09-07
    paths:
      - scripts/apply_static_cache_policy.py
      - .github/workflows/apply-static-cache-perf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/static-cache-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline syntax check
        run: python -m py_compile server.py
      - name: Apply guarded patch
        run: python scripts/apply_static_cache_policy.py
      - name: Syntax check with diagnostics
        run: |
          if ! python -m py_compile server.py; then
            echo '--- numbered context around failing area ---'
            nl -ba server.py | sed -n '2125,2195p'
            echo '--- patch diff ---'
            git diff -- server.py
            exit 1
          fi
      - name: Verify cache rules
        run: |
          grep -q "public, max-age=86400, stale-while-revalidate=604800" server.py
          grep -q "sensitive = raw_path.startswith" server.py
          python - <<'PY'
          from pathlib import Path
          s=Path('server.py').read_text(encoding='utf-8')
          start=s.index('    def send_file(self,path,content_type=None):')
          end=s.find('\n    def ', start+5)
          if end < 0: end=len(s)
          chunk=s[start:end]
          assert "self.send_header('Cache-Control','no-store')" not in chunk
          print('cache verification passed')
          PY
      - name: Commit patched server
        run: |
          if git diff --quiet -- server.py; then
            echo "No server.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "perf(server): cache static assets and uploads safely"
          git push origin HEAD:perf/static-cache-2026-09-07
