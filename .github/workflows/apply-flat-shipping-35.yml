name: Apply flat shipping 35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flat-shipping-35.yml'
      - 'tools/patch_flat_shipping_35.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch flat shipping policy
        run: python tools/patch_flat_shipping_35.py
      - name: Validate patch
        run: |
          python -m py_compile server.py
          grep -q 'flat-shipping-35-v1' server.py
          grep -q 'FLAT_SHIPPING_FEE=35.0' server.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          if git diff --cached --quiet; then
            echo "No application changes needed"
          else
            git commit -m "feat: apply flat 35 SAR shipping per active customer batch"
            git push origin HEAD:main
          fi
